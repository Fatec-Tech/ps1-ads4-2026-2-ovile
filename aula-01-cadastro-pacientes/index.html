<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastro de Pacientes</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- CSS do projeto -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="container py-5">

    <h1 class="mb-4">Cadastro de Pacientes</h1>


    <!-- ============================= -->
    <!-- FORMULÁRIO DE CADASTRO -->
    <!-- ============================= -->

    <form id="form-paciente" class="row g-3 mb-4">

      <!-- Nome -->
      <div class="col-md-3">

        <label for="nome" class="form-label">
          Nome
        </label>

        <input
          type="text"
          class="form-control"
          id="nome"
          autocomplete="name"
          required
        >

      </div>


      <!-- E-mail -->
      <div class="col-md-3">

        <label for="email" class="form-label">
          E-mail
        </label>

        <input
          type="email"
          class="form-control"
          id="email"
          autocomplete="email"
          required
        >

      </div>


      <!-- Telefone -->
      <div class="col-md-2">

        <label for="telefone" class="form-label">
          Telefone
        </label>

        <input
          type="tel"
          class="form-control"
          id="telefone"
          autocomplete="tel"
          required
        >

      </div>


      <!-- Data de nascimento -->
      <div class="col-md-3">

        <label for="nascimento" class="form-label">
          Data de nascimento
        </label>

        <input
          type="date"
          class="form-control"
          id="nascimento"
          autocomplete="bday"
          required
        >

      </div>


      <!-- Botão -->
      <div class="col-md-1 d-flex align-items-end">

        <button
          type="submit"
          class="btn btn-primary w-100"
        >
          +
        </button>

      </div>

    </form>



    <!-- ============================= -->
    <!-- BUSCA -->
    <!-- ============================= -->

    <div class="mb-4">

      <label for="busca" class="form-label">
        Buscar paciente por nome
      </label>

      <input
        type="text"
        class="form-control"
        id="busca"
        placeholder="Digite o nome do paciente..."
        autocomplete="off"
      >

    </div>



    <!-- ============================= -->
    <!-- CONTADOR -->
    <!-- ============================= -->

    <h2 class="h4 mb-3">

      Total de pacientes:
      <span id="contador-pacientes">0</span>

    </h2>



    <!-- ============================= -->
    <!-- TÍTULO DA TABELA -->
    <!-- ============================= -->

    <h2 class="h4 mb-3">
      Pacientes cadastrados
    </h2>



    <!-- ============================= -->
    <!-- TABELA -->
    <!-- ============================= -->

    <table class="table table-striped">

      <thead>

        <tr>

          <!-- Nome: clicável para ordenar -->
          <th
            id="ordenar-nome"
            title="Clique para ordenar"
          >
            Nome ↕
          </th>

          <th>
            E-mail
          </th>

          <th>
            Telefone
          </th>

          <th>
            Data de nascimento
          </th>

          <th>
            Idade
          </th>

          <th>
            Ações
          </th>

        </tr>

      </thead>


      <tbody id="tabela-pacientes">

        <!-- JavaScript adicionará as linhas aqui -->

      </tbody>

    </table>

  </div>


  <!-- JavaScript -->
  <script src="js/app.js"></script>

</body>

</html>
